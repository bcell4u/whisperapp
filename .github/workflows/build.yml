name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    # A probe-only update builds the probe, not the entire APK.
    paths-ignore:
      - ".github/workflows/qwen-native-bridge-probe.yml"
      - ".github/workflows/build.yml"
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Locate Gradle project
        shell: bash
        run: |
          set -euo pipefail
          SETTINGS_FILE="$(find . -maxdepth 3 -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit)"
          test -n "$SETTINGS_FILE" || { echo "No Gradle settings file found" >&2; exit 1; }
          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Gradle project found at: $PROJECT_DIR"

      - name: Load version metadata
        shell: bash
        run: |
          set -euo pipefail
          VERSION_FILE="$PROJECT_DIR/version.properties"
          test -f "$VERSION_FILE" || { echo "Missing version.properties" >&2; exit 1; }
          RELEASE_VERSION="$(sed -n 's/^releaseVersion=//p' "$VERSION_FILE")"
          VERSION_NAME="$(sed -n 's/^versionName=//p' "$VERSION_FILE")"
          VERSION_CODE="$(sed -n 's/^versionCode=//p' "$VERSION_FILE")"
          test -n "$RELEASE_VERSION" && test -n "$VERSION_NAME" && test -n "$VERSION_CODE"
          echo "APP_RELEASE_VERSION=$RELEASE_VERSION" >> "$GITHUB_ENV"
          echo "APP_RELEASE_TAG=v$RELEASE_VERSION" >> "$GITHUB_ENV"
          echo "APP_VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "APP_VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "Loaded v$RELEASE_VERSION / $VERSION_NAME / code $VERSION_CODE"

      - name: Verify source
        shell: bash
        run: bash "$PROJECT_DIR/scripts/verify-source.sh"

      - name: Validate unified Omi adapter against parakeet.cpp v0.5.0
        shell: bash
        run: |
          set -euo pipefail
          CHECK_DIR="$(mktemp -d)"
          trap 'rm -rf "$CHECK_DIR"' EXIT
          git clone --quiet --depth 1 --branch v0.5.0 https://github.com/mudler/parakeet.cpp.git "$CHECK_DIR/parakeet.cpp"
          ACTUAL_SHA="$(git -C "$CHECK_DIR/parakeet.cpp" rev-parse --short=7 HEAD)"
          test "$ACTUAL_SHA" = "1bfbebf" || {
            echo "parakeet.cpp v0.5.0 resolved to unexpected commit: $ACTUAL_SHA" >&2
            exit 1
          }
          grep -F 'parakeet_capi_transcribe_pcm_batch_json' "$CHECK_DIR/parakeet.cpp/include/parakeet_capi.h" >/dev/null || {
            echo "parakeet.cpp v0.5.0 no longer exposes timestamped PCM batch JSON" >&2
            exit 1
          }
          PATCH="$GITHUB_WORKSPACE/$PROJECT_DIR/parakeetnative/src/main/cpp/omi_adapter_runtime.patch"
          git -C "$CHECK_DIR/parakeet.cpp" apply --check --whitespace=nowarn "$PATCH"
          git -C "$CHECK_DIR/parakeet.cpp" apply --whitespace=nowarn "$PATCH"
          grep -F 'parakeet.omi_med_adapter.enabled' "$CHECK_DIR/parakeet.cpp/src/model_loader.cpp" >/dev/null
          grep -F 'omi_adapter' "$CHECK_DIR/parakeet.cpp/src/conformer.cpp" >/dev/null
          echo "Unified Omi adapter patch applies cleanly to parakeet.cpp v0.5.0 ($ACTUAL_SHA)"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          # The action's default package list includes the obsolete `tools`
          # package. Install only the command-line SDK here; the next step
          # pins every build dependency explicitly.
          packages: ''

      # Do not cache into the runner-owned /usr/local/lib/android/sdk:
      # cache extraction fails on existing SDK files with EPERM (run 102188263384).
      # sdkmanager below is idempotent and installs only missing pinned packages.
      - name: Install Android and native build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ccache
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.0.12077973" "cmake;3.22.1"

      - name: Test native speaker library isolation
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$ANDROID_HOME/ndk/27.0.12077973/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH"
          bash "$PROJECT_DIR/scripts/test-sherpa-elf-isolation.sh"

      - name: Fetch verified speaker diarization Android runtime
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$PROJECT_DIR/app/libs"
          AAR="$PROJECT_DIR/app/libs/sherpa-onnx-1.13.8.aar"
          curl --fail --location --retry 3 --connect-timeout 30 \
            --output "$AAR.part" \
            "https://github.com/k2-fsa/sherpa-onnx/releases/download/v1.13.8/sherpa-onnx-1.13.8.aar"
          echo "633c24321e06b1fe79feafa03ea16cbc0f8a286641e2da3559bac91bdb13bd96  $AAR.part" | sha256sum --check --status
          mv "$AAR.part" "$AAR"
          unzip -tq "$AAR" >/dev/null
          # sherpa ships its own ORT, built for a different version than our
          # ORT-QNN 1.27.0. Never pickFirst on libonnxruntime.so.
          # Rewrite in-place without growing ELF strings; validate DT_VERNEED.
          bash "$PROJECT_DIR/scripts/isolate-sherpa-onnx.sh" "$AAR"
          echo "Verified and isolated sherpa-onnx Android runtime v1.13.8"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore pinned native dependency sources
        uses: actions/cache@v4
        with:
          path: ${{ env.PROJECT_DIR }}/.native-deps
          key: native-deps-${{ runner.os }}-all-v2-${{ hashFiles('**/CMakeLists.txt', '**/parakeetnative/src/main/cpp/omi_adapter_runtime.patch') }}

      - name: Restore native compiler cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-${{ runner.os }}-android-ndk27-v6-${{ hashFiles('**/CMakeLists.txt', '**/*.cpp', '**/*.patch') }}
          restore-keys: |
            ccache-${{ runner.os }}-android-ndk27-v6-
            ccache-${{ runner.os }}-android-ndk27-parakeet-v050-omi-

      - name: Configure native compiler cache
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.cache/ccache"
          ccache --set-config=cache_dir="$HOME/.cache/ccache"
          ccache --max-size=2G
          ccache --zero-stats
          echo "CCACHE_DIR=$HOME/.cache/ccache" >> "$GITHUB_ENV"

      - name: Run JVM unit tests
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          gradle --no-daemon testDebugUnitTest --stacktrace --build-cache --max-workers=2

      - name: Detect release signing availability
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_SIGNING_CERT_SHA256: ${{ secrets.ANDROID_SIGNING_CERT_SHA256 }}
        run: |
          set -euo pipefail
          has_signing=true
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD ANDROID_SIGNING_CERT_SHA256; do
            if [ -z "${!name:-}" ]; then
              has_signing=false
            fi
          done
          echo "HAS_RELEASE_SIGNING=$has_signing" >> "$GITHUB_ENV"
          if [ "$has_signing" = "true" ]; then
            echo "Release signing secrets are available; this run will build a signed release APK."
          else
            echo "Release signing secrets are not configured; this run will build a debug APK, publish it as the Latest GitHub Release, and install it as Whisper Recorder Dev."
          fi

      - name: Restore permanent release signing key
        if: github.event_name != 'pull_request' && env.HAS_RELEASE_SIGNING == 'true'
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_SIGNING_CERT_SHA256: ${{ secrets.ANDROID_SIGNING_CERT_SHA256 }}
        run: |
          set -euo pipefail
          KEYSTORE_FILE="$RUNNER_TEMP/whisper-recorder-release.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_FILE"
          chmod 600 "$KEYSTORE_FILE"
          test -s "$KEYSTORE_FILE" || { echo "Decoded release keystore is empty" >&2; exit 1; }

          keytool -list -v \
            -keystore "$KEYSTORE_FILE" \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -alias "$ANDROID_KEY_ALIAS" >/tmp/whisper-signing-key.txt

          EXPECTED_CERT="$(printf '%s' "$ANDROID_SIGNING_CERT_SHA256" | tr -d '[:space:]:' | tr '[:lower:]' '[:upper:]')"
          ACTUAL_CERT="$(awk -F': ' '/SHA256:/{print $2; exit}' /tmp/whisper-signing-key.txt | tr -d ':' | tr '[:lower:]' '[:upper:]')"
          test -n "$ACTUAL_CERT" || { echo "Unable to read signing certificate SHA-256 fingerprint" >&2; exit 1; }
          test "$ACTUAL_CERT" = "$EXPECTED_CERT" || {
            echo "Release keystore certificate does not match ANDROID_SIGNING_CERT_SHA256." >&2
            echo "Expected: $EXPECTED_CERT" >&2
            echo "Actual:   $ACTUAL_CERT" >&2
            exit 1
          }

          echo "WHISPER_RELEASE_STORE_FILE=$KEYSTORE_FILE" >> "$GITHUB_ENV"
          echo "Verified permanent release signing certificate: $ACTUAL_CERT"

      - name: Build APK from source
        shell: bash
        env:
          WHISPER_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          WHISPER_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          WHISPER_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          if [ "${HAS_RELEASE_SIGNING:-false}" = "true" ] && [ "$GITHUB_EVENT_NAME" != "pull_request" ]; then
            test -n "${WHISPER_RELEASE_STORE_FILE:-}" || { echo "Release signing key was not restored" >&2; exit 1; }
            gradle --no-daemon assembleRelease --stacktrace --build-cache --max-workers=2
            APK="$PWD/app/build/outputs/apk/release/app-release.apk"
            VARIANT="release"
          else
            gradle --no-daemon assembleDebug --stacktrace --build-cache --max-workers=2
            APK="$PWD/app/build/outputs/apk/debug/app-debug.apk"
            VARIANT="debug"
          fi
          test -f "$APK"
          echo "APK_PATH=$APK" >> "$GITHUB_ENV"
          echo "APK_VARIANT=$VARIANT" >> "$GITHUB_ENV"
          echo "Built $VARIANT APK: $APK"

      - name: Native compiler cache stats
        if: always()
        shell: bash
        run: ccache --show-stats || true

      - name: Audit built APK
        shell: bash
        env:
          ANDROID_SIGNING_CERT_SHA256: ${{ secrets.ANDROID_SIGNING_CERT_SHA256 }}
        run: |
          set -euo pipefail
          APK="$APK_PATH"
          test -f "$APK"
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          BADGING="$("$AAPT" dump badging "$APK")"
          if [ "$APK_VARIANT" = "debug" ]; then
            EXPECTED_PACKAGE="com.example.whisperrecorder.dev"
            EXPECTED_VERSION_NAME="${APP_VERSION_NAME}-dev"
            EXPECTED_LABEL="Whisper Recorder Dev"
          else
            EXPECTED_PACKAGE="com.example.whisperrecorder"
            EXPECTED_VERSION_NAME="$APP_VERSION_NAME"
            EXPECTED_LABEL="Whisper Recorder"
          fi
          echo "$BADGING" | grep -F "package: name='$EXPECTED_PACKAGE'"
          echo "$BADGING" | grep -F "versionCode='$APP_VERSION_CODE'"
          echo "$BADGING" | grep -F "versionName='$EXPECTED_VERSION_NAME'"
          echo "$BADGING" | grep -F "application: label='$EXPECTED_LABEL'"

          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee /tmp/whisper-apksigner.txt
          if [ "$APK_VARIANT" = "release" ]; then
            EXPECTED_CERT="$(printf '%s' "$ANDROID_SIGNING_CERT_SHA256" | tr -d '[:space:]:' | tr '[:lower:]' '[:upper:]')"
            APK_CERT="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' /tmp/whisper-apksigner.txt | head -n 1 | tr -d ':' | tr '[:lower:]' '[:upper:]')"
            test -n "$APK_CERT" || { echo "Unable to read APK signing certificate" >&2; exit 1; }
            test "$APK_CERT" = "$EXPECTED_CERT" || {
              echo "Built APK was signed by an unexpected certificate." >&2
              echo "Expected: $EXPECTED_CERT" >&2
              echo "Actual:   $APK_CERT" >&2
              exit 1
            }
            echo "Permanent release signature verified: $APK_CERT"
          fi

          APK_ENTRIES="$(zipinfo -1 "$APK")"
          require_apk_entry() {
            local entry="$1"
            grep -Fx -- "$entry" <<<"$APK_ENTRIES" >/dev/null || {
              echo "APK is missing required entry: $entry" >&2
              exit 1
            }
            echo "$entry"
          }
          forbid_apk_entry_contains() {
            local needle="$1"
            if grep -F -- "$needle" <<<"$APK_ENTRIES" >/dev/null; then
              echo "APK contains forbidden entry matching: $needle" >&2
              exit 1
            fi
          }

          require_apk_entry 'lib/arm64-v8a/libwhisper_jni.so'
          require_apk_entry 'lib/arm64-v8a/libsherpa-onnx-jni.so'
          require_apk_entry 'lib/arm64-v8a/libsherpa_ort.so'
          require_apk_entry 'lib/arm64-v8a/libonnxruntime.so'
          require_apk_entry 'lib/arm64-v8a/libtranscribe_cpp_jni.so'
          # Verify the packaged ELF version-needs table, not just file presence.
          mkdir -p /tmp/whisper-speaker-elf
          unzip -p "$APK" 'lib/arm64-v8a/libsherpa-onnx-jni.so' > /tmp/whisper-speaker-elf/libsherpa-onnx-jni.so
          unzip -p "$APK" 'lib/arm64-v8a/libsherpa_ort.so' > /tmp/whisper-speaker-elf/libsherpa_ort.so
          python3 "$PROJECT_DIR/scripts/patch-sherpa-elf.py" --verify /tmp/whisper-speaker-elf
          forbid_apk_entry_contains 'lib/arm64-v8a/libomi_parakeet_jni.so'
          require_apk_entry 'lib/arm64-v8a/libparakeet_jni.so'
          if grep -E 'lib/arm64-v8a/libOpenCL\.so($|\.)' <<<"$APK_ENTRIES" >/dev/null; then
            echo "APK must use the device Qualcomm OpenCL runtime, not package the Khronos link-time loader" >&2
            exit 1
          fi

          MANIFEST_TREE="$("$AAPT" dump xmltree "$APK" AndroidManifest.xml)"
          grep -F 'libOpenCL.so' <<<"$MANIFEST_TREE" >/dev/null || {
            echo "APK manifest is missing optional libOpenCL.so vendor-library declaration" >&2
            exit 1
          }

          : > /tmp/whisper_dex_strings.txt
          while IFS= read -r dex; do
            unzip -p "$APK" "$dex" | strings -a >> /tmp/whisper_dex_strings.txt
          done < <(grep -E '^classes[0-9]*\.dex$' <<<"$APK_ENTRIES")
          require_dex_string() {
            local needle="$1"
            grep -F -- "$needle" /tmp/whisper_dex_strings.txt >/dev/null || {
              echo "APK DEX audit is missing expected ASCII marker: $needle" >&2
              exit 1
            }
          }
          require_dex_string 'NVIDIA Parakeet TDT 0.6B v3'
          require_dex_string 'Omi Med STT v1 Q8_0 (0.6B)'
          require_dex_string 'Qwen3-ASR 1.7B'
          # Verify shipped backend identifiers, not obsolete UI button labels.
          # This matches the previously fixed audit in the Qwen hybrid branch.
          require_dex_string 'parakeet_npu'
          require_dex_string 'omi_npu'
          require_dex_string 'qwen3_hybrid'
          require_dex_string 'Create speaker transcript'
          # Catch class stripping / missing AAR classes, not just missing .so files.
          bash "$PROJECT_DIR/scripts/audit-speaker-dex.sh" "$APK" "$ANDROID_HOME/build-tools/35.0.0/dexdump"
          # Match the production OpenCL worker's runtimeDiagnostics prefix.
          # The old 'v0.5.0 OpenCL / Adreno' label never existed as an emitted runtime string.
          require_dex_string 'parakeet.cpp 0.5.0 OpenCL device='
          if grep -F 'Voxtral Mini 3B 2507' /tmp/whisper_dex_strings.txt >/dev/null; then echo "APK still contains removed Voxtral model catalog entry" >&2; exit 1; fi
          if grep -F 'MedASR' /tmp/whisper_dex_strings.txt >/dev/null; then echo "APK still contains MedASR" >&2; exit 1; fi
          for old in 'Tiny English Q5' 'Base English Q5' 'Small English Q5' 'Medium English Q5'; do
            if grep -F -- "$old" /tmp/whisper_dex_strings.txt >/dev/null; then echo "APK still contains removed built-in: $old" >&2; exit 1; fi
          done
          MODEL_CANDIDATES="$(
            grep -E '^(assets/|res/raw/).*(\.(gguf|onnx|bin)$|(^|/)tokens\.txt$)' <<<"$APK_ENTRIES" || true
          )"
          if [ -n "$MODEL_CANDIDATES" ]; then
            echo "APK unexpectedly bundles model-weight assets:" >&2
            printf '%s\n' "$MODEL_CANDIDATES" >&2
            exit 1
          fi
          echo "Built APK audit PASSED"

      - name: Fingerprint APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$APK_PATH"
          SHORT_SHA="${GITHUB_SHA:0:7}"
          DIST_DIR="$PROJECT_DIR/app/build/distributions"
          mkdir -p "$DIST_DIR"
          if [ "$APK_VARIANT" = "release" ]; then
            OUT="$DIST_DIR/WhisperRecorder-${APP_RELEASE_TAG}-${SHORT_SHA}.apk"
          elif [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            OUT="$DIST_DIR/WhisperRecorder-${APP_RELEASE_TAG}-pr-${SHORT_SHA}.apk"
          else
            OUT="$DIST_DIR/WhisperRecorder-${APP_RELEASE_TAG}-debug-${SHORT_SHA}.apk"
          fi
          cp "$APK" "$OUT"
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          SIGNER_CERT_SHA256="$("$APKSIGNER" verify --print-certs "$OUT" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n 1)"
          {
            echo "Whisper Recorder $APP_RELEASE_TAG"
            echo "versionName=$APP_VERSION_NAME"
            echo "versionCode=$APP_VERSION_CODE"
            echo "variant=$APK_VARIANT"
            echo "commit=$GITHUB_SHA"
            echo "run_id=$GITHUB_RUN_ID"
            echo "signer_cert_sha256=$SIGNER_CERT_SHA256"
            echo "apk_sha256=$(sha256sum "$OUT" | awk '{print $1}')"
            echo "apk_bytes=$(stat -c%s "$OUT")"

            native_uncompressed_total=0
            native_compressed_total=0
            while IFS= read -r native_path; do
              test -n "$native_path" || continue
              lib="${native_path##*/}"
              key="$(printf '%s' "${lib%.so}" | tr -c 'A-Za-z0-9_' '_')"
              uncompressed="$(zipinfo -l "$OUT" "$native_path" | awk -v n="$native_path" '$10 == n {print $4}')"
              compressed="$(zipinfo -l "$OUT" "$native_path" | awk -v n="$native_path" '$10 == n {print $6}')"
              uncompressed="${uncompressed:-0}"
              compressed="${compressed:-0}"
              echo "native_${key}_uncompressed_bytes=$uncompressed"
              echo "native_${key}_compressed_bytes=$compressed"
              native_uncompressed_total=$((native_uncompressed_total + uncompressed))
              native_compressed_total=$((native_compressed_total + compressed))
            done < <(zipinfo -1 "$OUT" | grep -E '^lib/arm64-v8a/.*\.so$' | sort)
            echo "native_total_uncompressed_bytes=$native_uncompressed_total"
            echo "native_total_compressed_bytes=$native_compressed_total"

            dex_uncompressed_bytes="$(zipinfo -l "$OUT" | awk '$10 ~ /^classes[0-9]*\.dex$/ {sum += $4} END {print sum+0}')"
            dex_compressed_bytes="$(zipinfo -l "$OUT" | awk '$10 ~ /^classes[0-9]*\.dex$/ {sum += $6} END {print sum+0}')"
            echo "dex_uncompressed_bytes=$dex_uncompressed_bytes"
            echo "dex_compressed_bytes=$dex_compressed_bytes"
            echo "app_source_tree_sha256=$(find "$PROJECT_DIR/app/src/main/java" -type f -name '*.kt' -print0 | sort -z | xargs -0 sha256sum | sha256sum | awk '{print $1}')"
          } > "$DIST_DIR/build-proof.txt"
          echo "DIST_DIR=$DIST_DIR" >> "$GITHUB_ENV"
          echo "VERSIONED_APK=$OUT" >> "$GITHUB_ENV"
          cat "$DIST_DIR/build-proof.txt"

      - name: Upload installable APK and build proof
        uses: actions/upload-artifact@v4
        with:
          name: WhisperRecorder-build-${{ github.run_number }}
          path: |
            ${{ env.PROJECT_DIR }}/app/build/distributions/WhisperRecorder-*.apk
            ${{ env.PROJECT_DIR }}/app/build/distributions/build-proof.txt
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release
        if: github.event_name != 'pull_request' && (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main'))
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SOURCE_APK="$VERSIONED_APK"
          PROOF="$DIST_DIR/build-proof.txt"
          test -f "$SOURCE_APK" || { echo "Versioned APK not found" >&2; exit 1; }
          test -f "$PROOF" || { echo "Build proof not found" >&2; exit 1; }

          if [ "$APK_VARIANT" = "release" ] && [ "$GITHUB_REF" = "refs/heads/main" ]; then
            RELEASE_TAG="$APP_RELEASE_TAG"
            RELEASE_TITLE="Whisper Recorder $APP_RELEASE_TAG"
            RELEASE_APK="$DIST_DIR/WhisperRecorder-${APP_RELEASE_TAG}.apk"
            cp "$SOURCE_APK" "$RELEASE_APK"

            if ! EXISTING_TAG_SHA="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" --jq '.object.sha' 2>/dev/null)"; then
              EXISTING_TAG_SHA=""
            fi
            if [ -n "$EXISTING_TAG_SHA" ] && [ "$EXISTING_TAG_SHA" != "$GITHUB_SHA" ]; then
              echo "Release tag $RELEASE_TAG already points to $EXISTING_TAG_SHA; bump the app version before publishing a different signed release." >&2
              exit 1
            fi

            if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
              gh release upload "$RELEASE_TAG" "$RELEASE_APK" "$PROOF" --clobber
            else
              gh release create "$RELEASE_TAG" \
                "$RELEASE_APK" "$PROOF" \
                --target "$GITHUB_SHA" \
                --title "$RELEASE_TITLE" \
                --generate-notes
            fi
          else
            RELEASE_TAG="${APP_RELEASE_TAG}-build-${GITHUB_RUN_NUMBER}"
            RELEASE_TITLE="Whisper Recorder ${APP_RELEASE_TAG} build ${GITHUB_RUN_NUMBER}"
            RELEASE_APK="$DIST_DIR/WhisperRecorder-${APP_RELEASE_TAG}-build-${GITHUB_RUN_NUMBER}.apk"
            cp "$SOURCE_APK" "$RELEASE_APK"

            if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
              gh release upload "$RELEASE_TAG" "$RELEASE_APK" "$PROOF" --clobber
              gh release edit "$RELEASE_TAG" --latest
            else
              gh release create "$RELEASE_TAG" \
                "$RELEASE_APK" "$PROOF" \
                --target "$GITHUB_SHA" \
                --title "$RELEASE_TITLE" \
                --notes "Automated development build. Variant: $APK_VARIANT. Commit: $GITHUB_SHA. Debug builds install as Whisper Recorder Dev and can coexist with the production app." \
                --latest
            fi
          fi
