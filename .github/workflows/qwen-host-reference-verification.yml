# 6.6.19 HOST ONLY: independent published Hugging Face Qwen text decoder reference.
name: Qwen independent Transformers prefill
on:
  push:
    branches: [main]
    paths:
      - 'verification/host/**'
      - 'verification/fixtures/**'
      - 'scripts/evaluate-qwen-*.py'
      - 'scripts/produce-qwen-hf-reference.py'
      - 'scripts/test-qwen-*.py'
      - '.github/workflows/qwen-host-reference-verification.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  hf-independent-prefill:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout source and check synthetic fixtures
        uses: actions/checkout@v4
      - name: Verify static Lab and independent evaluator controls
        run: |
          set -euo pipefail
          python3 scripts/verify-lab-source.py
          python3 scripts/test-qwen-independent-reference.py
      - name: Install pinned llama.cpp build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends cmake ninja-build g++ libcurl4-openssl-dev
      - name: Fetch exact historical llama.cpp implementation
        run: |
          set -euo pipefail
          git clone --quiet --depth 1 --branch v0.6.0 https://github.com/ggml-org/llama.cpp.git "$RUNNER_TEMP/llama-host"
          REVISION="$(git -C "$RUNNER_TEMP/llama-host" rev-parse HEAD)"
          test "$REVISION" = 'd81235049384534c167caea52b85a694f6103d14'
          echo "REFERENCE_LLAMA_REV=$REVISION" >> "$GITHUB_ENV"
      - name: Build unmodified AVX2 host numerical control
        run: |
          set -euo pipefail
          BUILD="$RUNNER_TEMP/qwen-hf-compare-host"
          cmake -S verification/host -B "$BUILD" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DLLAMA_CPP_SOURCE="$RUNNER_TEMP/llama-host" \
            -DCMAKE_INTERPROCEDURAL_OPTIMIZATION=OFF \
            -DGGML_NATIVE=OFF -DGGML_AVX512=OFF -DGGML_AVX_VNNI=OFF \
            -DGGML_AVX512_VNNI=OFF -DGGML_AVX512_VBMI=OFF \
            -DGGML_AMX_TILE=OFF -DGGML_AMX_INT8=OFF -DGGML_AMX_BF16=OFF \
            -DGGML_CPU_KLEIDIAI=OFF -DGGML_BLAS=OFF -DGGML_LLAMAFILE=OFF \
            -DGGML_SSE42=ON -DGGML_AVX=ON -DGGML_AVX2=ON \
            -DGGML_FMA=ON -DGGML_F16C=ON -DGGML_BMI2=ON
          cmake --build "$BUILD" --target qwen-mixed-reference --parallel 4
          test -x "$BUILD/qwen-mixed-reference"
      - name: Fetch fixed public GGUF decoder weights only into runner temp
        run: |
          set -euo pipefail
          Q8="$RUNNER_TEMP/Qwen3-ASR-0.6B-Q8_0.gguf"
          BF16="$RUNNER_TEMP/Qwen3-ASR-0.6B-bf16.gguf"
          curl --fail --location --retry 4 --retry-all-errors --connect-timeout 30 --max-time 3600 -o "$Q8" \
            'https://huggingface.co/ggml-org/Qwen3-ASR-0.6B-GGUF/resolve/main/Qwen3-ASR-0.6B-Q8_0.gguf?download=true'
          echo "bca259818b50ca7c4c05e9bdb35a5dc04fa039653a6d6f3f0f331f96f6aa1971  $Q8" | sha256sum -c -
          curl --fail --location --retry 4 --retry-all-errors --connect-timeout 30 --max-time 3600 -o "$BF16" \
            'https://huggingface.co/ggml-org/Qwen3-ASR-0.6B-GGUF/resolve/main/Qwen3-ASR-0.6B-bf16.gguf?download=true'
          echo "12b2894d9a7c98cd8f26670f5a47ab738f42bcc98df21e109be493870c71ba50  $BF16" | sha256sum -c -
          echo "GGUF_Q8=$Q8" >> "$GITHUB_ENV"
          echo "GGUF_BF16=$BF16" >> "$GITHUB_ENV"
      - name: Recreate three GGUF baseline prefill vectors
        run: |
          set -euo pipefail
          mkdir -p artifact
          FEATURES=verification/fixtures/s26-synthetic-features.f32le
          RUNNER="$RUNNER_TEMP/qwen-hf-compare-host/qwen-mixed-reference"
          for spec in q8_flash_on bf16_flash_off bf16_flash_on; do
            MODEL="$GGUF_Q8"
            case "$spec" in bf16_*) MODEL="$GGUF_BF16" ;; esac
            ATTENTION="${spec##*_}"
            mkdir -p "artifact/$spec"
            "$RUNNER" "$MODEL" "$FEATURES" "artifact/$spec" unified 256 4 original "flash-$ATTENTION" \
              > "artifact/$spec/inference.log" 2>&1
            test -s "artifact/$spec/logits-step-00.f32le"
          done
      - name: Setup separate Python for Hugging Face reference
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install separate official-model Transformers CPU implementation
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --no-cache-dir \
            --index-url https://download.pytorch.org/whl/cpu 'torch==2.7.1+cpu'
          python3 -m pip install --disable-pip-version-check --no-cache-dir \
            'transformers>=5,<6' 'huggingface_hub>=0.30' \
            'safetensors>=0.5' 'accelerate>=1.0'
          python3 -c 'import transformers, torch; from transformers import Qwen3ASRForConditionalGeneration; print("hf_packages",transformers.__version__,torch.__version__)'
      - name: Execute independent eager PyTorch Qwen prefill
        env:
          HF_HOME: ${{ runner.temp }}/qwen-hf-cache
          OMP_NUM_THREADS: '4'
          TOKENIZERS_PARALLELISM: 'false'
          MODEL_REPO: Qwen/Qwen3-ASR-0.6B-hf
        run: |
          set -euo pipefail
          mkdir -p artifact/hf
          python3 scripts/produce-qwen-hf-reference.py \
            --features verification/fixtures/s26-synthetic-features.f32le \
            --output artifact/hf > artifact/hf/run.log 2>&1 || { cat artifact/hf/run.log; exit 1; }
          test -s artifact/hf/hf-prefill-logits.f32le
      - name: Compare independent logits and report limitations
        run: |
          set -euo pipefail
          python3 scripts/evaluate-qwen-independent-reference.py \
            --fixtures verification/fixtures \
            --hf-dir artifact/hf \
            --q8-flash-on artifact/q8_flash_on \
            --bf16-flash-off artifact/bf16_flash_off \
            --bf16-flash-on artifact/bf16_flash_on \
            --output artifact/INDEPENDENT_REFERENCE_REPORT.json
      - name: Create explicit inconclusive report if any phase fails
        if: always()
        run: |
          set -euo pipefail
          mkdir -p artifact
          if [ ! -s artifact/INDEPENDENT_REFERENCE_REPORT.json ]; then
            python3 - <<'PYREPORT'
          import json
          from pathlib import Path
          Path('artifact/INDEPENDENT_REFERENCE_REPORT.json').write_text(json.dumps({
             'schema':1,'release':'6.6.19','status':'INCONCLUSIVE',
             'reason':'SETUP_MODEL_DOWNLOAD_HF_PACKAGE_OR_INFERENCE_FAILED',
             'independent_model_execution':False,'official_qwen_full_asr_parity':'NOT_VERIFIED',
             'mrope_parity':'UNQUALIFIED'
          },indent=2)+'\n')
          PYREPORT
          fi
      - name: Provenance and model identity limitations
        if: always()
        run: |
          set -euo pipefail
          mkdir -p artifact
          {
            echo 'WhisperRecorder 6.6.19 independent HF Transformers prefill audit'
            echo "lab_commit=$GITHUB_SHA"
            echo "upstream_llama_revision=${REFERENCE_LLAMA_REV:-NOT_FETCHED}"
            echo 'reference_kind=INDEPENDENT_HF_TRANSFORMERS_PREFILL'
            echo 'reference_checkpoint=Qwen/Qwen3-ASR-0.6B-hf, revision prefix 6aa69c3'
            echo 'model_checkpoint_shas_in_HF_REFERENCE_METADATA_JSON_if_executed=true'
            echo 'gguf_base_model=Qwen/Qwen3-ASR-0.6B'
            echo 'gguf_to_hf_weight_identity=NOT_VERIFIED'
            echo 'fixture_sha256=e03a26e5e9253b05d4fad885db48dd38cb2e19e5a843e27d6d8d2e95c6cbe0ee'
            echo 's26_logits_sha256=9951cd0ed4143a97f4181c3fe0b87086aaf7f77b8571c63ea41d5597ef41a8e2'
            echo 'mrope_parity=UNQUALIFIED'
            echo 'official_audio_encoder_parity=NOT_VERIFIED'
            echo 'synthetic_only=true; no_audio_transcripts_signing_material_or_private_paths'
            echo 'no_android_decoder_changes=true'
          } > artifact/PROVENANCE.txt
      - name: Upload results regardless of outcome
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qwen-6.6.19-hf-independent-prefill-${{ github.run_number }}
          path: artifact/
          if-no-files-found: error
          retention-days: 14
