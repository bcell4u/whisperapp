# 6.6.15: within-model batch sensitivity for Q8_0 vs BF16 Qwen3-ASR 0.6B.
# This tests llama.cpp host execution, not official model parity or the Android APK.
name: Qwen host precision and batch isolation
on:
  push:
    branches: [main]
    paths:
      - 'verification/host/**'
      - 'verification/fixtures/**'
      - 'scripts/evaluate-qwen-*.py'
      - 'scripts/test-qwen-*.py'
      - '.github/workflows/qwen-host-reference-verification.yml'
  workflow_dispatch:
    inputs:
      llama_revision:
        description: 'Pinned host llama.cpp library revision'
        required: true
        type: choice
        options: [v0.6.0, master]
        default: v0.6.0
permissions:
  contents: read
jobs:
  precision-batch-isolation:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout synthetic-only Lab source
        uses: actions/checkout@v4
      - name: Run numerical evaluation regression tests
        run: |
          set -euo pipefail
          python3 scripts/test-qwen-external-reference.py
          python3 scripts/test-qwen-batch-paths.py
          python3 scripts/test-qwen-chunk-isolation.py
          python3 scripts/test-qwen-boundary-isolation.py
          python3 scripts/test-qwen-execution-sensitivity.py
          python3 scripts/test-qwen-microbatch-threshold.py
          python3 scripts/test-qwen-input-kind-isolation.py
          python3 scripts/test-qwen-precision-batch.py
      - name: Install host C++ dependencies
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends cmake ninja-build g++ libcurl4-openssl-dev
      - name: Fetch approved llama.cpp source
        env:
          LLAMA_REVISION: ${{ inputs.llama_revision || 'v0.6.0' }}
        run: |
          set -euo pipefail
          case "$LLAMA_REVISION" in v0.6.0|master) ;; *) exit 2;; esac
          git clone --quiet --depth 1 --branch "$LLAMA_REVISION" \
            https://github.com/ggml-org/llama.cpp.git "$RUNNER_TEMP/llama-host"
          REVISION="$(git -C "$RUNNER_TEMP/llama-host" rev-parse HEAD)"
          if [ "$LLAMA_REVISION" = v0.6.0 ]; then
            test "${REVISION:0:7}" = d812350 || { echo 'Pinned llama.cpp tag moved'; exit 1; }
          fi
          echo "REFERENCE_LLAMA_REV=$REVISION" >> "$GITHUB_ENV"
      - name: Compile host test against same llama.cpp CPU kernels
        run: |
          set -euo pipefail
          cmake -S verification/host -B "$RUNNER_TEMP/qwen-ref-build" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DLLAMA_CPP_SOURCE="$RUNNER_TEMP/llama-host" \
            -DCMAKE_INTERPROCEDURAL_OPTIMIZATION=OFF
          cmake --build "$RUNNER_TEMP/qwen-ref-build" --target qwen-mixed-reference --parallel 4
          test -x "$RUNNER_TEMP/qwen-ref-build/qwen-mixed-reference"
      - name: Download and SHA-verify published Q8_0 and BF16 decoder GGUFs
        run: |
          set -euo pipefail
          Q8="$RUNNER_TEMP/Qwen3-ASR-0.6B-Q8_0.gguf"
          BF16="$RUNNER_TEMP/Qwen3-ASR-0.6B-bf16.gguf"
          curl --fail --location --retry 4 --retry-all-errors \
            --connect-timeout 30 --max-time 3600 -o "$Q8" \
            'https://huggingface.co/ggml-org/Qwen3-ASR-0.6B-GGUF/resolve/main/Qwen3-ASR-0.6B-Q8_0.gguf?download=true'
          echo "bca259818b50ca7c4c05e9bdb35a5dc04fa039653a6d6f3f0f331f96f6aa1971  $Q8" | sha256sum -c -
          curl --fail --location --retry 4 --retry-all-errors \
            --connect-timeout 30 --max-time 3600 -o "$BF16" \
            'https://huggingface.co/ggml-org/Qwen3-ASR-0.6B-GGUF/resolve/main/Qwen3-ASR-0.6B-bf16.gguf?download=true'
          echo "12b2894d9a7c98cd8f26670f5a47ab738f42bcc98df21e109be493870c71ba50  $BF16" | sha256sum -c -
          echo "QWEN_REFERENCE_MODEL_Q8=$Q8" >> "$GITHUB_ENV"
          echo "QWEN_REFERENCE_MODEL_BF16=$BF16" >> "$GITHUB_ENV"
      - name: Execute two precisions against same prompt partition controls
        run: |
          set -euo pipefail
          MIXED="$RUNNER_TEMP/qwen-ref-build/qwen-mixed-reference"
          FEATURES=verification/fixtures/s26-synthetic-features.f32le
          mkdir -p artifact
          for precision in q8 bf16; do
            case "$precision" in
              q8) MODEL="$QWEN_REFERENCE_MODEL_Q8" ;;
              bf16) MODEL="$QWEN_REFERENCE_MODEL_BF16" ;;
            esac
            for kind in orig text; do
              case "$kind" in orig) KIND_ARG=original ;; text) KIND_ARG=text-filler ;; esac
              for mode in unified three-stage; do
                case "$mode" in unified) MODE_KEY=unified ;; three-stage) MODE_KEY=three_stage ;; esac
                for UBATCH in 128 256; do
                  DEST="artifact/${precision}_${kind}_${MODE_KEY}_u${UBATCH}"
                  mkdir -p "$DEST"
                  "$MIXED" "$MODEL" "$FEATURES" "$DEST" "$mode" "$UBATCH" 4 "$KIND_ARG"
                done
              done
            done
            DEST="artifact/${precision}_orig_unified_u256_replay"
            mkdir -p "$DEST"
            "$MIXED" "$MODEL" "$FEATURES" "$DEST" unified 256 4 original
          done
          ARGS=()
          for precision in q8 bf16; do
            for kind in orig text; do
              for mode in unified three_stage; do
                for UBATCH in 128 256; do
                  KEY="${precision}_${kind}_${mode}_u${UBATCH}"
                  ARGS+=( "--${KEY//_/-}" "artifact/$KEY" )
                done
              done
            done
            KEY="${precision}_orig_unified_u256_replay"
            ARGS+=( "--${KEY//_/-}" "artifact/$KEY" )
          done
          python3 scripts/evaluate-qwen-precision-batch.py \
            --fixtures verification/fixtures \
            --llama-revision "$REFERENCE_LLAMA_REV" \
            --output artifact/PRECISION_BATCH_REPORT.json \
            "${ARGS[@]}"
      - name: Ensure an explicit inconclusive record on any failure
        if: always()
        run: |
          set -euo pipefail
          mkdir -p artifact
          if [ ! -s artifact/PRECISION_BATCH_REPORT.json ]; then
            python3 - <<'PYREPORT'
          import json
          from pathlib import Path
          Path('artifact/PRECISION_BATCH_REPORT.json').write_text(json.dumps({
              'schema':1,'release':'6.6.15','status':'INCONCLUSIVE',
              'reason':'SETUP_DOWNLOAD_COMPILATION_OR_INFERENCE_FAILED',
              'model_math_independent':False,'official_qwen_parity':'NOT_VERIFIED',
              'mrope_parity':'UNQUALIFIED'
          },indent=2)+'\n')
          PYREPORT
          fi
      - name: Export fixed provenance and scope notes
        if: always()
        run: |
          set -euo pipefail
          mkdir -p artifact
          {
            echo 'WhisperRecorder 6.6.15: synthetic only, Q8_0 vs BF16 batch sensitivity'
            echo "lab_commit=$GITHUB_SHA"
            echo "upstream_revision=${REFERENCE_LLAMA_REV:-NOT_FETCHED}"
            echo 'reference_kind=SAME_HOST_PRECISION_BATCH_CONTROL'
            echo 'model_math_independent=false'
            echo 'official_qwen_parity=NOT_VERIFIED'
            echo 'mrope_parity=UNQUALIFIED'
            echo 'q8_sha256=bca259818b50ca7c4c05e9bdb35a5dc04fa039653a6d6f3f0f331f96f6aa1971'
            echo 'bf16_sha256=12b2894d9a7c98cd8f26670f5a47ab738f42bcc98df21e109be493870c71ba50'
            echo 'synthetic_features_sha256=e03a26e5e9253b05d4fad885db48dd38cb2e19e5a843e27d6d8d2e95c6cbe0ee'
            echo 's26_logits_sha256=9951cd0ed4143a97f4181c3fe0b87086aaf7f77b8571c63ea41d5597ef41a8e2'
            echo 'n_ctx=512 n_batch=256 n_ubatch=128_or_256 threads=4 gpu_layers=0'
            echo 'teacher_forced_steps=5; S26 comparison only at step00 and with Q8'
            echo 'input_kinds=orig,text; prompt_groups=unified,three_stage'
            echo 'BF16 is a precision isolation control, not a drop-in phone model recommendation.'
          } > artifact/PROVENANCE.txt
      - name: Upload numerical checkpoints and reports regardless of result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qwen-6.6.15-host-precision-batch-${{ github.run_number }}
          path: artifact/
          retention-days: 14
          if-no-files-found: error
