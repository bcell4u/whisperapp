# 6.6.16: same-host CPU SIMD feature control; synthetic only; no Android bridge changes.
name: Qwen host CPU ISA isolation
on:
  push:
    branches: [main]
    paths:
      - 'verification/host/**'
      - 'verification/fixtures/**'
      - 'scripts/evaluate-qwen-*.py'
      - 'scripts/test-qwen-*.py'
      - '.github/workflows/qwen-host-reference-verification.yml'
  workflow_dispatch:
    inputs:
      llama_revision:
        description: 'Pinned host llama.cpp library revision'
        required: true
        type: choice
        options: [v0.6.0, master]
        default: v0.6.0
permissions:
  contents: read
jobs:
  cpu-isa-isolation:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout synthetic-only Lab source
        uses: actions/checkout@v4
      - name: Verify evaluator and historical regressions
        run: |
          set -euo pipefail
          python3 scripts/test-qwen-external-reference.py
          python3 scripts/test-qwen-batch-paths.py
          python3 scripts/test-qwen-chunk-isolation.py
          python3 scripts/test-qwen-boundary-isolation.py
          python3 scripts/test-qwen-execution-sensitivity.py
          python3 scripts/test-qwen-microbatch-threshold.py
          python3 scripts/test-qwen-input-kind-isolation.py
          python3 scripts/test-qwen-precision-batch.py
          python3 scripts/test-qwen-cpu-isa.py
      - name: Install host C++ dependencies
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends cmake ninja-build g++ libcurl4-openssl-dev
      - name: Fetch SHA-pinned llama.cpp source
        env:
          LLAMA_REVISION: ${{ inputs.llama_revision || 'v0.6.0' }}
        run: |
          set -euo pipefail
          case "$LLAMA_REVISION" in v0.6.0|master) ;; *) exit 2;; esac
          git clone --quiet --depth 1 --branch "$LLAMA_REVISION" \
            https://github.com/ggml-org/llama.cpp.git "$RUNNER_TEMP/llama-host"
          REVISION="$(git -C "$RUNNER_TEMP/llama-host" rev-parse HEAD)"
          if [ "$LLAMA_REVISION" = v0.6.0 ]; then
            test "${REVISION:0:7}" = d812350 || { echo 'Pinned llama.cpp tag moved'; exit 1; }
          fi
          echo "REFERENCE_LLAMA_REV=$REVISION" >> "$GITHUB_ENV"
      - name: Build portable and SIMD CPU executables from same source
        run: |
          set -euo pipefail
          for isa in simd portable; do
            BUILD="$RUNNER_TEMP/qwen-ref-$isa"
            ISA_FLAGS=( -DGGML_NATIVE=OFF -DGGML_AVX512=OFF -DGGML_AVX_VNNI=OFF \
              -DGGML_AVX512_VNNI=OFF -DGGML_AVX512_VBMI=OFF -DGGML_AMX_TILE=OFF \
              -DGGML_AMX_INT8=OFF -DGGML_AMX_BF16=OFF -DGGML_CPU_KLEIDIAI=OFF \
              -DGGML_BLAS=OFF -DGGML_LLAMAFILE=OFF )
            if [ "$isa" = simd ]; then
              ISA_FLAGS+=( -DGGML_SSE42=ON -DGGML_AVX=ON -DGGML_AVX2=ON \
                -DGGML_FMA=ON -DGGML_F16C=ON -DGGML_BMI2=ON )
            else
              ISA_FLAGS+=( -DGGML_SSE42=OFF -DGGML_AVX=OFF -DGGML_AVX2=OFF \
                -DGGML_FMA=OFF -DGGML_F16C=OFF -DGGML_BMI2=OFF )
            fi
            cmake -S verification/host -B "$BUILD" -G Ninja \
              -DCMAKE_BUILD_TYPE=Release -DLLAMA_CPP_SOURCE="$RUNNER_TEMP/llama-host" \
              -DCMAKE_INTERPROCEDURAL_OPTIMIZATION=OFF "${ISA_FLAGS[@]}"
            cmake --build "$BUILD" --target qwen-mixed-reference --parallel 4
            test -x "$BUILD/qwen-mixed-reference"
            grep -Fq "GGML_NATIVE:BOOL=OFF" "$BUILD/CMakeCache.txt"
            case "$isa" in
              simd) grep -Fq 'GGML_AVX2:BOOL=ON' "$BUILD/CMakeCache.txt" ;;
              portable) grep -Fq 'GGML_AVX2:BOOL=OFF' "$BUILD/CMakeCache.txt" ;;
            esac
          done
      - name: Download and SHA-verify both public GGUFs
        run: |
          set -euo pipefail
          Q8="$RUNNER_TEMP/Qwen3-ASR-0.6B-Q8_0.gguf"
          BF16="$RUNNER_TEMP/Qwen3-ASR-0.6B-bf16.gguf"
          curl --fail --location --retry 4 --retry-all-errors \
            --connect-timeout 30 --max-time 3600 -o "$Q8" \
            'https://huggingface.co/ggml-org/Qwen3-ASR-0.6B-GGUF/resolve/main/Qwen3-ASR-0.6B-Q8_0.gguf?download=true'
          echo "bca259818b50ca7c4c05e9bdb35a5dc04fa039653a6d6f3f0f331f96f6aa1971  $Q8" | sha256sum -c -
          curl --fail --location --retry 4 --retry-all-errors \
            --connect-timeout 30 --max-time 3600 -o "$BF16" \
            'https://huggingface.co/ggml-org/Qwen3-ASR-0.6B-GGUF/resolve/main/Qwen3-ASR-0.6B-bf16.gguf?download=true'
          echo "12b2894d9a7c98cd8f26670f5a47ab738f42bcc98df21e109be493870c71ba50  $BF16" | sha256sum -c -
          echo "QWEN_REFERENCE_MODEL_Q8=$Q8" >> "$GITHUB_ENV"
          echo "QWEN_REFERENCE_MODEL_BF16=$BF16" >> "$GITHUB_ENV"
      - name: Run same-weight instruction-set controls and compare all logits
        run: |
          set -euo pipefail
          FEATURES=verification/fixtures/s26-synthetic-features.f32le
          mkdir -p artifact
          ARGS=()
          for precision in q8 bf16; do
            case "$precision" in
              q8) MODEL="$QWEN_REFERENCE_MODEL_Q8" ;;
              bf16) MODEL="$QWEN_REFERENCE_MODEL_BF16" ;;
            esac
            for isa in simd portable; do
              RUNNER="$RUNNER_TEMP/qwen-ref-$isa/qwen-mixed-reference"
              for mode in unified three-stage; do
                case "$mode" in unified) MODE_KEY=unified ;; three-stage) MODE_KEY=three_stage ;; esac
                for UBATCH in 128 256; do
                  KEY="${precision}_${isa}_${MODE_KEY}_u${UBATCH}"
                  mkdir -p "artifact/$KEY"
                  "$RUNNER" "$MODEL" "$FEATURES" "artifact/$KEY" "$mode" "$UBATCH" 4 original
                  ARGS+=( "--${KEY//_/-}" "artifact/$KEY" )
                done
              done
              KEY="${precision}_${isa}_unified_u256_replay"
              mkdir -p "artifact/$KEY"
              "$RUNNER" "$MODEL" "$FEATURES" "artifact/$KEY" unified 256 4 original
              ARGS+=( "--${KEY//_/-}" "artifact/$KEY" )
            done
          done
          python3 scripts/evaluate-qwen-cpu-isa.py \
            --fixtures verification/fixtures \
            --llama-revision "$REFERENCE_LLAMA_REV" \
            --output artifact/CPU_ISA_REPORT.json "${ARGS[@]}"
      - name: Create explicit inconclusive report on any failure
        if: always()
        run: |
          set -euo pipefail
          mkdir -p artifact
          if [ ! -s artifact/CPU_ISA_REPORT.json ]; then
            python3 - <<'PYREPORT'
          import json
          from pathlib import Path
          Path('artifact/CPU_ISA_REPORT.json').write_text(json.dumps({
             'schema':1,'release':'6.6.16','status':'INCONCLUSIVE',
             'reason':'SETUP_COMPILATION_DOWNLOAD_OR_INFERENCE_FAILED',
             'model_math_independent':False,'official_qwen_parity':'NOT_VERIFIED',
             'mrope_parity':'UNQUALIFIED'
          },indent=2)+'\n')
          PYREPORT
          fi
      - name: Export reproducibility data and scope notes
        if: always()
        run: |
          set -euo pipefail
          mkdir -p artifact
          {
            echo 'WhisperRecorder 6.6.16: x86-64 SIMD vs portable CPU GGUF isolation'
            echo "lab_commit=$GITHUB_SHA"
            echo "upstream_revision=${REFERENCE_LLAMA_REV:-NOT_FETCHED}"
            echo 'reference_kind=SAME_HOST_CPU_ISA_CONTROL'
            echo 'model_math_independent=false'
            echo 'official_qwen_parity=NOT_VERIFIED'
            echo 'mrope_parity=UNQUALIFIED'
            echo 'q8_sha256=bca259818b50ca7c4c05e9bdb35a5dc04fa039653a6d6f3f0f331f96f6aa1971'
            echo 'bf16_sha256=12b2894d9a7c98cd8f26670f5a47ab738f42bcc98df21e109be493870c71ba50'
            echo 'synthetic_features_sha256=e03a26e5e9253b05d4fad885db48dd38cb2e19e5a843e27d6d8d2e95c6cbe0ee'
            echo 's26_logits_sha256=9951cd0ed4143a97f4181c3fe0b87086aaf7f77b8571c63ea41d5597ef41a8e2'
            echo 'threads=4; n_ctx=512; n_batch=256; n_ubatch=128_or_256'
            echo 'input_kind=synthetic_audio_embeddings; prompt_grouping=unified,three_stage'
            echo 'simd=AVX2_AVX_SSE42_FMA_F16C_BMI2; portable=none_of_these'
            echo 'Different ISA arithmetic does not by itself imply a bug.'
            echo "compiler=$(g++ --version | head -1)"
          } > artifact/PROVENANCE.txt
          for isa in simd portable; do
            FILE="$RUNNER_TEMP/qwen-ref-$isa/CMakeCache.txt"
            if [ -f "$FILE" ]; then
              grep -E '^(GGML_(NATIVE|SSE42|AVX|AVX2|AVX512|FMA|F16C|BMI2|BLAS|LLAMAFILE):BOOL)=' "$FILE" \
                > "artifact/CMAKE_FLAGS_${isa}.txt" || true
            fi
          done
      - name: Upload synthetic numerical checkpoints regardless of result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qwen-6.6.16-host-cpu-isa-${{ github.run_number }}
          path: artifact/
          retention-days: 14
          if-no-files-found: error
