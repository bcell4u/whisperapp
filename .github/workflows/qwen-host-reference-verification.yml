# v6.6.27 host-only GGUF BF16 M-RoPE single-axis attribution.
# Does not change Android inference, QNN, production release, or transcription data.
name: Qwen GGUF RoPE axis attribution
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/qwen-host-reference-verification.yml'
      - 'scripts/evaluate-qwen-rope-axis.py'
      - 'scripts/test-qwen-rope-axis.py'
      - 'scripts/test-qwen-workflow-context.py'
      - 'scripts/verify-lab-source.py'
      - 'verification/host/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  host-rope-axis:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      OMP_NUM_THREADS: '4'
    steps:
      - name: Checkout isolated Lab source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Initialize temporary directories on runner
        run: |
          set -euo pipefail
          test -n "${RUNNER_TEMP:-}"
          mkdir -p "$RUNNER_TEMP/qwen-hf-cache" artifact/host
          echo "HF_HOME=$RUNNER_TEMP/qwen-hf-cache" >> "$GITHUB_ENV"
      - name: Validate source and axis attribution failure cases
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --no-cache-dir 'numpy>=1.26,<3'
          python3 scripts/verify-lab-source.py
          python3 scripts/test-qwen-rope-axis.py
          python3 scripts/test-qwen-workflow-context.py
      - name: Download SHA-verified public GGUF BF16
        run: |
          set -euo pipefail
          BF16="$RUNNER_TEMP/Qwen3-ASR-0.6B-bf16.gguf"
          curl --fail --location --retry 4 --retry-all-errors --connect-timeout 30 --max-time 3600 \
            -o "$BF16" 'https://huggingface.co/ggml-org/Qwen3-ASR-0.6B-GGUF/resolve/main/Qwen3-ASR-0.6B-bf16.gguf?download=true'
          echo "12b2894d9a7c98cd8f26670f5a47ab738f42bcc98df21e109be493870c71ba50  $BF16" | sha256sum -c -
          echo "GGUF_BF16=$BF16" >> "$GITHUB_ENV"
      - name: Build pinned host llama.cpp M-RoPE probe
        run: |
          set -euo pipefail
          command -v ninja >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y ninja-build; }
          git clone --quiet --depth 1 --branch v0.6.0 https://github.com/ggml-org/llama.cpp.git "$RUNNER_TEMP/llama-host"
          test "$(git -C "$RUNNER_TEMP/llama-host" rev-parse HEAD)" = d81235049384534c167caea52b85a694f6103d14
          cmake -S verification/host -B "$RUNNER_TEMP/host-build" -G Ninja \
            -DLLAMA_CPP_SOURCE="$RUNNER_TEMP/llama-host" -DCMAKE_BUILD_TYPE=Release \
            -DGGML_NATIVE=OFF -DGGML_OPENMP=OFF -DBUILD_SHARED_LIBS=OFF
          cmake --build "$RUNNER_TEMP/host-build" --target qwen-mixed-reference --parallel 4
          echo "MIXED_RUNNER=$RUNNER_TEMP/host-build/qwen-mixed-reference" >> "$GITHUB_ENV"
      - name: Phase 1 - linear baseline and uniform-position controls
        id: baseline
        continue-on-error: true
        run: |
          set -euo pipefail
          failures=0
          for mode in pos-linear pos-plus1 pos-plus17 pos-suffix-gap11; do
            for attn in flash-off flash-on; do
              folder="artifact/host/$mode/$attn"
              mkdir -p "$folder"
              if "$MIXED_RUNNER" "$GGUF_BF16" verification/fixtures/s26-synthetic-features.f32le \
                  "$folder" unified 256 4 original "$attn" "$mode" >"$folder/inference.log" 2>&1 \
                  && test -s "$folder/logits-step-00.f32le"; then
                echo "PASS: $mode $attn"
              else
                echo "INCONCLUSIVE_HOST_BRANCH: $mode $attn" >&2
                failures=$((failures + 1))
              fi
              rm -f "$folder"/logits-step-0[1-5].f32le
            done
          done
          test "$failures" -eq 0
      - name: Phase 2 - perturb each GGUF position axis independently
        id: axes
        continue-on-error: true
        run: |
          set -euo pipefail
          failures=0
          for family in pos-plus17 pos-suffix-gap11; do
            for axis in 0 1 2 3; do
              mode="$family-axis$axis"
              for attn in flash-off flash-on; do
                folder="artifact/host/$mode/$attn"
                mkdir -p "$folder"
                if "$MIXED_RUNNER" "$GGUF_BF16" verification/fixtures/s26-synthetic-features.f32le \
                    "$folder" unified 256 4 original "$attn" "$mode" >"$folder/inference.log" 2>&1 \
                    && test -s "$folder/logits-step-00.f32le"; then
                  echo "PASS: $mode $attn"
                else
                  echo "INCONCLUSIVE_HOST_BRANCH: $mode $attn" >&2
                  failures=$((failures + 1))
                fi
                rm -f "$folder"/logits-step-0[1-5].f32le
              done
            done
          done
          test "$failures" -eq 0
      - name: Phase 3 - compare axis responses and verify graph paths
        if: always()
        continue-on-error: true
        run: |
          set -euo pipefail
          mkdir -p artifact
          python3 scripts/evaluate-qwen-rope-axis.py --artifact-dir artifact \
            --output artifact/ROPE_AXIS_ATTRIBUTION_REPORT.json
      - name: Write privacy-safe synthetic provenance
        if: always()
        run: |
          set -euo pipefail
          mkdir -p artifact
          {
            echo 'WhisperRecorder v6.6.27 GGUF M-RoPE host-only single-axis position attribution'
            echo "lab_commit=$GITHUB_SHA"
            echo 'llama_cpp_commit=d81235049384534c167caea52b85a694f6103d14'
            echo 'gguf_bf16_sha256=12b2894d9a7c98cd8f26670f5a47ab738f42bcc98df21e109be493870c71ba50'
            echo 'features_sha256=e03a26e5e9253b05d4fad885db48dd38cb2e19e5a843e27d6d8d2e95c6cbe0ee'
            echo 'position_controls=linear,plus1,plus17,suffix-gap11,plus17-axis0..3,suffix-gap11-axis0..3'
            echo 'host_attention=flash-off,flash-on;host_batch=256;host_threads=4'
            echo 'official_asr_mrope_grid_parity=NOT_VERIFIED;synthetic_only=true'
            echo 'android_decoder_changed=false;no_user_audio_or_transcript=true'
          } > artifact/PROVENANCE.txt
      - name: Upload axis attribution output even when a branch fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qwen-6.6.27-host-rope-axis-attribution-${{ github.run_number }}
          path: artifact/
          if-no-files-found: error
          retention-days: 14
      - name: Fail if any required axis or attention graph was not observed
        if: always()
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('artifact/ROPE_AXIS_ATTRIBUTION_REPORT.json')
          if not p.is_file(): raise SystemExit('AXIS_ATTRIBUTION_REPORT_UNAVAILABLE')
          d=json.loads(p.read_text())
          if d['status']!='MROPE_AXIS_ATTRIBUTION_COMPLETE':
              raise SystemExit('AXIS_ATTRIBUTION_INCOMPLETE: review artifact missing list')
          print('GGUF axis attribution complete; no official audio M-RoPE parity implied')
          PY
