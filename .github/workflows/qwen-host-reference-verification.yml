# 6.6.20 HOST ONLY: exact-weight provenance audit, no Android inference changes.
name: Qwen HF versus GGUF BF16 weight identity
on:
  push:
    branches: [main]
    paths:
      - 'scripts/audit-qwen-gguf-hf-weights.py'
      - 'scripts/test-qwen-weight-identity.py'
      - 'scripts/produce-qwen-hf-reference.py'
      - 'LAB_6_6_20_WEIGHT_IDENTITY.md'
      - '.github/workflows/qwen-host-reference-verification.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  hf-gguf-weight-identity:
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    steps:
      - name: Checkout and verify Lab source, synthetic model-free tests
        uses: actions/checkout@v4
      - name: Validate weight parser and identity contracts
        run: |
          set -euo pipefail
          python3 scripts/verify-lab-source.py
          python3 scripts/test-qwen-weight-identity.py
      - name: Install checkpoint downloader
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --no-cache-dir 'huggingface_hub>=0.30,<2'
      - name: Fetch public fixed BF16 GGUF to ephemeral runner directory
        run: |
          set -euo pipefail
          mkdir -p artifact
          BF16="$RUNNER_TEMP/Qwen3-ASR-0.6B-bf16.gguf"
          curl --fail --location --retry 4 --retry-all-errors --connect-timeout 30 --max-time 3600 \
            -o "$BF16" 'https://huggingface.co/ggml-org/Qwen3-ASR-0.6B-GGUF/resolve/main/Qwen3-ASR-0.6B-bf16.gguf?download=true'
          echo "12b2894d9a7c98cd8f26670f5a47ab738f42bcc98df21e109be493870c71ba50  $BF16" | sha256sum -c -
          echo "GGUF_BF16=$BF16" >> "$GITHUB_ENV"
      - name: Fetch pinned Hugging Face BF16 reference checkpoint to runner cache
        env:
          HF_HOME: ${{ runner.temp }}/qwen-hf-cache
          HF_HUB_DISABLE_TELEMETRY: '1'
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          from huggingface_hub import snapshot_download
          from pathlib import Path
          import os
          revision='6aa69c382e2b426eee1f5870d4c95859a74b6445'
          snapshot=Path(snapshot_download(repo_id='Qwen/Qwen3-ASR-0.6B-hf',revision=revision,
                                          allow_patterns=['model.safetensors']))
          assert snapshot.name==revision, 'HF_RESOLVED_REVISION_MISMATCH'
          tensor=snapshot/'model.safetensors'
          assert tensor.is_file(), 'HF_WEIGHT_NOT_FOUND'
          h=hashlib.sha256()
          with tensor.open('rb') as f:
              for block in iter(lambda:f.read(4*1024*1024), b''):h.update(block)
          assert h.hexdigest()=='d3f212dd20abecd315d830bc54ae3865e56ebfc3276484e57b771288ba27fd35', 'HF_WEIGHT_HASH_MISMATCH'
          with open(os.environ['GITHUB_ENV'],'a') as f:f.write('HF_SAFETENSORS='+str(tensor)+'\n')
          print('HF_CHECKPOINT_HASH_VERIFIED revision='+revision)
          PY
      - name: Audit exact decoder tensor values without executing inference
        run: |
          set -euo pipefail
          python3 scripts/audit-qwen-gguf-hf-weights.py \
            --gguf "$GGUF_BF16" --hf "$HF_SAFETENSORS" \
            --output artifact/WEIGHT_IDENTITY_REPORT.json
          test -s artifact/WEIGHT_IDENTITY_REPORT.json
      - name: Fail closed when setup, fetch or audit fails
        if: always()
        run: |
          set -euo pipefail
          mkdir -p artifact
          if [ ! -s artifact/WEIGHT_IDENTITY_REPORT.json ]; then
            python3 - <<'PYREPORT'
          import json
          from pathlib import Path
          Path('artifact/WEIGHT_IDENTITY_REPORT.json').write_text(json.dumps({
            'schema':1,'release':'6.6.20','status':'INCONCLUSIVE',
            'reason':'SOURCE_CHECK_DOWNLOAD_CHECKSUM_OR_TENSOR_AUDIT_FAILED',
            'model_weight_identity':'NOT_VERIFIED',
            'official_mrope_parity':'UNQUALIFIED',
            'official_full_asr_parity':'NOT_VERIFIED'
          },indent=2)+'\n')
          PYREPORT
          fi
      - name: Record reproducible provenance and scope
        if: always()
        run: |
          set -euo pipefail
          mkdir -p artifact
          {
            echo 'WhisperRecorder 6.6.20 exact BF16 tensor audit'
            echo "lab_commit=$GITHUB_SHA"
            echo 'hf_revision=6aa69c382e2b426eee1f5870d4c95859a74b6445'
            echo 'hf_safetensors_sha256=d3f212dd20abecd315d830bc54ae3865e56ebfc3276484e57b771288ba27fd35'
            echo 'gguf_bf16_sha256=12b2894d9a7c98cd8f26670f5a47ab738f42bcc98df21e109be493870c71ba50'
            echo 'direct_tensor_identity_only; qk_rope_permutations_excluded=true'
            echo 'whole_model_weight_identity=NOT_VERIFIED'
            echo 'original_vs_hf_architecture_and_multiaxis_mrope_parity=UNQUALIFIED'
            echo 'synthetic_only=true; no_speech_or_transcript_or_credential_export'
            echo 'android_decoder_and_performance_settings_unchanged=true'
          } > artifact/PROVENANCE.txt
      - name: Upload report regardless of outcome
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qwen-6.6.20-hf-gguf-weight-identity-${{ github.run_number }}
          path: artifact/
          if-no-files-found: error
          retention-days: 14
