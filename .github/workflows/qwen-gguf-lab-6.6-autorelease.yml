# 6.6.0 EXPERIMENTAL LAB ONLY. Each push to main publishes a new GitHub
# prerelease after all compile, signing, package ID, and protocol checks pass.
# Uses the SAME five signing-secret names as the original 6.5.22 workflow.
# NEVER produces the production applicationId or a stable production release.
name: Qwen GGUF Lab 6.6 Android APK + Auto Release
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: qwen-lab-main-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build-and-release-lab:
    if: github.repository_owner != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout experimental source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify lab rebase and 6.6 metadata
        run: |
          set -euo pipefail
          python3 scripts/verify-lab-source.py
          test ! -e .github/workflows/build.yml
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''
      - name: Install pinned Android SDK and tools
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ninja-build ccache
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.0.12077973' 'cmake;3.22.1'
      - name: Verify sherpa ELF isolation prerequisites
        run: |
          set -euo pipefail
          export PATH="$ANDROID_HOME/ndk/27.0.12077973/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH"
          bash scripts/test-sherpa-elf-isolation.sh
      - name: Fetch and isolate pinned sherpa AAR
        run: |
          set -euo pipefail
          mkdir -p app/libs
          AAR=app/libs/sherpa-onnx-1.13.8.aar
          curl -fL --retry 3 --connect-timeout 30 -o "$AAR.part" \
            https://github.com/k2-fsa/sherpa-onnx/releases/download/v1.13.8/sherpa-onnx-1.13.8.aar
          echo "633c24321e06b1fe79feafa03ea16cbc0f8a286641e2da3559bac91bdb13bd96  $AAR.part" | sha256sum -c -
          mv "$AAR.part" "$AAR"
          bash scripts/isolate-sherpa-onnx.sh "$AAR"
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Fetch pinned v0.4.96 llama.cpp dependency
        run: |
          set -euo pipefail
          git clone --quiet --depth 1 --branch v0.6.0 https://github.com/ggml-org/llama.cpp.git native/qwen_bridge/llama.cpp
          test "$(git -C native/qwen_bridge/llama.cpp rev-parse --short=7 HEAD)" = d812350
      - name: Compile ARM64 dot-product GGUF bridge
        run: |
          set -euo pipefail
          cmake -S native/qwen_bridge -B build-qwen-bridge -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_HOME/ndk/27.0.12077973/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-30 -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF -DGGML_OPENMP=OFF -DGGML_NATIVE=OFF -DWR_ENABLE_ARM_DOTPROD=ON
          cmake --build build-qwen-bridge --target wr-qwen-gguf-bridge-probe --parallel 4
      - name: Validate and package native ELF for Lab APK
        run: |
          set -euo pipefail
          ELF=build-qwen-bridge/wr-qwen-gguf-bridge-probe
          test -s "$ELF"
          file "$ELF"
          readelf -h "$ELF" | grep -E 'AArch64|DYN' || true
          python3 - <<'PY'
          from pathlib import Path
          p=Path('build-qwen-bridge/wr-qwen-gguf-bridge-probe')
          blob=p.read_bytes()
          assert blob[:4] == b'\x7fELF' and blob[4]==2 and blob[5]==1
          assert int.from_bytes(blob[18:20], 'little') == 183, 'not ARM64'
          assert int.from_bytes(blob[16:18], 'little') == 3, 'Android executable must be PIE/ET_DYN'
          for marker in (b'WR_BRIDGE_PROBE_PROTOCOL_0496_DOTPROD_V1', b'WR_BRIDGE_APP_PRIVATE_PROTOCOL_0001'):
              assert marker in blob, f'missing native protocol: {marker!r}'
          PY
          # The CLI is PIE/ELF, NOT a JNI .so. It is stored as lib*.so so that
          # Android's native library installer extracts it to executable code storage.
          # Its on-device subprocess permission/SELinux remains a PHONE TEST gate.
          mkdir -p app/src/main/jniLibs/arm64-v8a
          cp "$ELF" app/src/main/jniLibs/arm64-v8a/libwrqwengguflab.so
          readelf -d "$ELF" | tee /tmp/wrqwen-native-needed.txt
          if grep -Eq '\(NEEDED\).*\[(libllama|libggml)' /tmp/wrqwen-native-needed.txt; then
            echo 'Decoder is not self-contained: missing static llama/ggml link' >&2; exit 1
          fi
      - name: Restore stable Android signing certificate if available
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_SIGNING_CERT_SHA256: ${{ secrets.ANDROID_SIGNING_CERT_SHA256 }}
        run: |
          set -euo pipefail
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo 'Stable key not provided: using ephemeral runner debug signing; update install may require uninstall.'
            echo 'LAB_STABLE_SIGNING=false' >> "$GITHUB_ENV"
            exit 0
          fi
          for var in ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD ANDROID_SIGNING_CERT_SHA256; do
            if [ -z "${!var}" ]; then echo "Incomplete key configuration: $var" >&2; exit 1; fi
          done
          KEYSTORE="$RUNNER_TEMP/qwen-lab-release-identity.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
          chmod 600 "$KEYSTORE"
          keytool -list -v -keystore "$KEYSTORE" -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -alias "$ANDROID_KEY_ALIAS" > "$RUNNER_TEMP/lab-key-audit.txt"
          ACTUAL="$(awk -F': ' '/SHA256:/{print $2; exit}' "$RUNNER_TEMP/lab-key-audit.txt" | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')"
          EXPECTED="$(printf '%s' "$ANDROID_SIGNING_CERT_SHA256" | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')"
          test -n "$ACTUAL" && test "$ACTUAL" = "$EXPECTED" || { echo 'Signing certificate SHA-256 mismatch' >&2; exit 1; }
          echo "WR_LAB_STORE_FILE=$KEYSTORE" >> "$GITHUB_ENV"
          echo 'LAB_STABLE_SIGNING=true' >> "$GITHUB_ENV"
      - name: Build and test v6.6.0 isolated debug APK
        env:
          WR_LAB_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          WR_LAB_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          WR_LAB_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          gradle --no-daemon --max-workers=2 :app:assembleDebug :app:testDebugUnitTest --stacktrace
      - name: Inspect APK application ID, version, signing, and native payload
        env:
          ANDROID_SIGNING_CERT_SHA256: ${{ secrets.ANDROID_SIGNING_CERT_SHA256 }}
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          BADGING="$($ANDROID_HOME/build-tools/35.0.0/aapt dump badging "$APK")"
          echo "$BADGING" | grep -F "package: name='com.example.whisperrecorder.qwengguflab.dev'"
          echo "$BADGING" | grep -F "versionCode='66000'"
          echo "$BADGING" | grep -F "versionName='6.6.0-dev'"
          echo "$BADGING" | grep -F "application: label='Qwen GGUF Lab'"
          python3 - <<'PY'
          from zipfile import ZipFile
          with ZipFile('app/build/outputs/apk/debug/app-debug.apk') as z:
              target='lib/arm64-v8a/libwrqwengguflab.so'
              assert target in z.namelist(), 'native executable not packaged'
              assert b'WR_BRIDGE_APP_PRIVATE_PROTOCOL_0001' in z.read(target)
              assert 'lib/arm64-v8a/libonnxruntime_providers_qnn.so' in z.namelist(), 'QNN provider missing'
              assert 'lib/arm64-v8a/libQnnHtp.so' in z.namelist(), 'QNN backend missing'
          PY
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee "$RUNNER_TEMP/lab-apksigner.txt"
          CERT="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' "$RUNNER_TEMP/lab-apksigner.txt" | head -1 | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')"
          test -n "$CERT"
          if [ "${LAB_STABLE_SIGNING:-false}" = true ]; then
            EXPECTED="$(printf '%s' "$ANDROID_SIGNING_CERT_SHA256" | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')"
            test "$CERT" = "$EXPECTED" || { echo 'Wrong APK signer' >&2; exit 1; }
          fi
          echo "LAB_SIGNER_SHA256=$CERT" >> "$GITHUB_ENV"
      - name: Stage isolated signed APK + build receipts
        run: |
          set -euo pipefail
          mkdir -p artifact
          SHORT_SHA="${GITHUB_SHA:0:10}"
          APK_NAME="WhisperRecorder-Qwen-GGUF-Lab-v6.6.0-${SHORT_SHA}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "artifact/$APK_NAME"
          (cd artifact && sha256sum "$APK_NAME" > SHA256SUMS.txt)
          {
            echo 'WhisperRecorder Qwen GGUF Lab v6.6.0 EXPERIMENTAL / NOT PHONE-QUALIFIED'
            echo "commit=$GITHUB_SHA"
            echo "run_id=$GITHUB_RUN_ID"
            echo 'versionName=6.6.0-dev'
            echo 'versionCode=66000'
            echo 'applicationId=com.example.whisperrecorder.qwengguflab.dev'
            echo "stable_signing=${LAB_STABLE_SIGNING:-false}"
            echo "signer_sha256=$LAB_SIGNER_SHA256"
            echo 'native=v0.4.96 arm64 dotprod llama.cpp v0.6.0 d812350'
            echo 'QNN requires compatible user-supplied encoder; no model included'
            echo 'APK compile status: PASS if and only if this step completes in GitHub Actions'
            echo 'On-device subprocess and QNN accuracy: NOT TESTED'
          } > artifact/BUILD_PROOF.txt
          echo "LAB_APK_NAME=$APK_NAME" >> "$GITHUB_ENV"
      - name: Upload debug APK as Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: whisperrecorder-qwen-gguf-lab-v6.6.0-${{ github.run_number }}
          path: artifact/
          retention-days: 30
          if-no-files-found: error
      - name: Automatically publish successful main builds to GitHub Releases
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Pre-release tags cannot consume or overwrite the production v6.6.0 tag.
          TAG="v6.6.0-lab.${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}.g${GITHUB_SHA:0:10}"
          gh release create "$TAG" \
            "artifact/$LAB_APK_NAME" artifact/SHA256SUMS.txt artifact/BUILD_PROOF.txt \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "WhisperRecorder Qwen GGUF Lab 6.6.0 ($GITHUB_SHA)" \
            --notes 'Experimental 6.6.0 QNN encoder + ARM64 dotprod GGUF decoder. Separate lab application ID. Not phone-qualified; private QNN and GGUF models required. All compilation and APK checks must pass before release.' \
            --prerelease --latest=false
